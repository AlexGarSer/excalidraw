services:
  excalidraw:
    build:
      context: .
      args:
        - NODE_ENV=production
    container_name: excalidraw
    # only reachable through the host nginx (TLS termination)
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: areki_backend
    # no published ports: only the excalidraw container talks to it
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-12}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - ESCENAS_DIR=/data/escenas
    # case diagrams live on the server only (git-ignored, the repo is public)
    volumes:
      - ./escenas:/data/escenas:ro
    restart: unless-stopped
