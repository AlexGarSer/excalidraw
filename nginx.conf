server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Areki backend (login/session). Not exposed outside the docker network.
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # hashed build assets never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # always revalidate the entry points so deploys are picked up
    location ~ ^/(index\.html|service-worker\.js|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback for react-router routes (/login, /dashboard, /archify...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Obsidian vault published with Quartz (vault.areki.mx). Static files mounted
# from the host (git-ignored); every request needs the dashboard session
# (cookie shared on .areki.mx via COOKIE_DOMAIN).
server {
    listen 80;
    listen [::]:80;
    server_name vault.areki.mx;
    root /usr/share/nginx/vault;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "private, no-cache" always;
    # the site works offline: block the CDN loads Quartz may attempt (mermaid);
    # the graph view (PixiJS) needs 'unsafe-eval'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'" always;

    auth_request /_session;
    error_page 401 = @login;

    location = /_session {
        internal;
        proxy_pass http://backend:3001/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login {
        return 302 https://dashboard.areki.mx/login?next=https://$host$request_uri;
    }

    # Quartz links pages without the .html extension
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
